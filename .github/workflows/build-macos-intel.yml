# Build a macOS Intel (x86_64) DeepSeek Harness desktop app on GitHub Actions
# WITHOUT an Apple Developer certificate.
#
# Why this workflow exists
# ------------------------
# The upstream packaging pipeline refuses unsigned macOS builds: it requires a
# Developer ID certificate, a matching Team ID, a hardened runtime and notarization.
# This workflow relaxes exactly those assertions (see "Apply the local build patches"),
# signs the bundle with a throwaway self-signed certificate generated on the runner,
# and publishes the .app as a zip + dmg. The result is fully self-contained and works
# on another Mac after the recipient clears the quarantine attribute.
#
# Runner choice
# -------------
# macos-15-intel is the standard *Intel (x64)* macOS image; macos-26-intel is the
# alternative. macos-latest / macos-15 / macos-26 are arm64 and cannot produce this
# build through the upstream pipeline. Standard runners are free and unlimited on
# public repositories; private repositories are billed at about $0.062/minute.
#
# Disk budget
# -----------
# A standard macOS runner advertises 14 GB of usable SSD and this build needs about
# 9 GB, so the "Free disk space" step below reclaims simulator runtimes and caches.
#
# What to expect
# --------------
# The packaging command always ends by asking Apple to notarize, with placeholder
# credentials, so it exits non-zero. The .app is complete before that step and its
# runtime smoke test has already passed, so the workflow tolerates that one failure
# and validates the bundle itself instead.

name: Build macOS Intel (x86_64)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a GitHub Release containing the zip and dmg
        type: boolean
        default: false
      release_tag:
        description: Release tag to use (leave empty for dsh-macos-x64-<version>-<sha>)
        type: string
        required: false
        default: ''

# Creating a Release needs write access; everything else only reads the repository.
permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'
  APP_PATH: apps/desktop/.desktop-build/targets/mac-x64/artifacts/mac/DeepSeek Harness.app
  SMOKE_MARKER: 'desktop runtime: DOCX, XLSX, PPTX to PDF and skill CLI discovery passed'

concurrency:
  group: build-macos-intel
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - name: Report runner
        run: |
          sw_vers
          uname -m
          df -h /

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Free disk space
        run: |
          # The image ships iOS simulator runtimes and Homebrew caches this build never
          # touches, and the build tree needs roughly 9 GB of the 14 GB available.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          rm -rf ~/Library/Caches/Homebrew ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
          df -h /

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # Runs before the (slow) install so a moved upstream anchor fails in seconds.
      - name: Apply the local build patches
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          MARKER = "LOCAL NON-APPLE BUILD PATCH"
          SIG = "apps/desktop/scripts/verify-macos-signature.mjs"
          CFG = "apps/desktop/scripts/electron-builder-config.mjs"

          # (file, name, old, new). Applied by anchor string rather than by unified diff so
          # the workflow fails loudly, instead of silently mis-patching, when upstream moves.
          PATCHES = [
              (
                  SIG,
                  "accept a signature without an Apple team identifier",
                  "  const missing = [expectedAuthority, expectedTeam].filter(field => !fields.has(field))\n",
                  "  // " + MARKER + ": a self-signed certificate carries no Apple-issued team\n"
                  "  // identifier, so `codesign --display` prints \"TeamIdentifier=not set\". Accept that\n"
                  "  // placeholder as satisfying the team assertion. Every other check (authority, secure\n"
                  "  // timestamp, --verify --strict) is unchanged.\n"
                  "  const teamSatisfied = fields.has(expectedTeam) || fields.has('TeamIdentifier=not set')\n"
                  "  const missing = [expectedAuthority, ...(teamSatisfied ? [] : [expectedTeam])]\n"
                  "    .filter(field => !fields.has(field))\n",
              ),
              (
                  SIG,
                  "drop the hardened-runtime assertion",
                  "  if (!fields.some(line => /\\bflags=0x[0-9a-f]+\\(runtime\\)(?:\\s|$)/iu.test(line))) {\n"
                  "    throw new Error('desktop macOS signing: runtime signature does not enable hardened runtime')\n"
                  "  }\n",
                  "  // " + MARKER + ": hardened runtime enables library validation, which cannot be\n"
                  "  // satisfied without an Apple-issued team identifier, so local builds sign without\n"
                  "  // `--options runtime`. The hardened-runtime assertion is intentionally omitted.\n",
              ),
              (
                  SIG,
                  "sign runtime code without --options runtime",
                  "    '--identifier', identifier,\n"
                  "    '--timestamp',\n"
                  "    '--options', 'runtime',\n",
                  "    '--identifier', identifier,\n"
                  "    '--timestamp',\n"
                  "    // " + MARKER + ": `--options runtime` removed because hardened runtime enables\n"
                  "    // library validation, which needs an Apple team identifier.\n",
              ),
              (
                  CFG,
                  "disable hardened runtime for the packed app",
                  "      forceCodeSigning: true,\n      hardenedRuntime: true,\n",
                  "      forceCodeSigning: true,\n"
                  "      // " + MARKER + ": hardened runtime disabled, see verify-macos-signature.mjs.\n"
                  "      hardenedRuntime: false,\n",
              ),
          ]

          def main() -> int:
              pending = []
              for rel, name, old, new in PATCHES:
                  path = pathlib.Path(rel)
                  text = path.read_text(encoding="utf-8")
                  if new in text:
                      print(f"already applied: {rel}: {name}")
                      continue
                  if old not in text:
                      print(f"ERROR: anchor not found in {rel}: {name}", file=sys.stderr)
                      print("       Upstream changed the packaging scripts; re-derive this patch by hand.", file=sys.stderr)
                      return 1
                  if text.count(old) != 1:
                      print(f"ERROR: anchor is ambiguous ({text.count(old)}x) in {rel}: {name}", file=sys.stderr)
                      return 1
                  pending.append((path, old, new, name))
              for path, old, new, name in pending:
                  text = path.read_text(encoding="utf-8")
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  print(f"patched: {path.name}: {name}")
              if not pending:
                  print("all patches already applied")
              return 0

          raise SystemExit(main())
          PY

      - name: Create and trust a self-signed signing certificate
        run: |
          # A certificate must carry the Code Signing extended key usage to appear in
          # `security find-identity -p codesigning`. The harness prefixes the configured
          # identity with "Developer ID Application: ", so the common name below has to
          # keep that prefix while .env.macos must not (the pipeline rejects the prefix).
          CERT_DIR="$RUNNER_TEMP/local-signing"
          mkdir -p "$CERT_DIR"
          cat > "$CERT_DIR/openssl.cnf" <<'EOF'
          [req]
          distinguished_name = dn
          prompt = no
          [dn]
          CN = Developer ID Application: DSH Local Build (LOCAL00001)
          O = DSH Local Build
          [v3]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          extendedKeyUsage = codeSigning
          subjectKeyIdentifier = hash
          EOF
          openssl req -x509 -sha256 -newkey rsa:2048 -nodes -days 365 \
            -keyout "$CERT_DIR/key.pem" -out "$CERT_DIR/cert.pem" \
            -config "$CERT_DIR/openssl.cnf" -extensions v3
          openssl pkcs12 -export -inkey "$CERT_DIR/key.pem" -in "$CERT_DIR/cert.pem" \
            -out "$CERT_DIR/dsh-local.p12" -passout pass:dshlocal
          # Trust settings are what make `find-identity -v` (valid identities only) succeed;
          # the admin domain plus System keychain is the only non-interactive location.
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$CERT_DIR/cert.pem"

          # Fail fast, before the ~90 minute build, if the p12 cannot be imported or the
          # identity is not considered valid. Mirrors the lookup the packaging pipeline does.
          security create-keychain -p dshverify "$RUNNER_TEMP/verify.keychain-db"
          security unlock-keychain -p dshverify "$RUNNER_TEMP/verify.keychain-db"
          security import "$CERT_DIR/dsh-local.p12" -k "$RUNNER_TEMP/verify.keychain-db" \
            -P dshlocal -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k dshverify \
            "$RUNNER_TEMP/verify.keychain-db" >/dev/null
          FOUND=$(security find-identity -v -p codesigning "$RUNNER_TEMP/verify.keychain-db" \
            | grep -cF "DSH Local Build (LOCAL00001)" || true)
          security delete-keychain "$RUNNER_TEMP/verify.keychain-db"
          if [ "$FOUND" -lt 1 ]; then
            echo "::error::the generated certificate is not a valid code-signing identity; is the trust step allowed on this runner?"
            security find-identity -p codesigning || true
            exit 1
          fi
          echo "signing identity is valid: DSH Local Build (LOCAL00001)"

      - name: Write apps/desktop/.env.macos
        run: |
          # Internal build settings. Every URL below is a placeholder that never resolves,
          # so the packaged app fails closed on update checks. The only real value is the
          # signing material generated in the previous step; no secrets are involved.
          CERT_DIR="$RUNNER_TEMP/local-signing"
          printf '%s\n' 'dummy placeholder (not a real App Store Connect API key)' > "$CERT_DIR/notary-dummy.txt"
          cat > apps/desktop/.env.macos <<EOF
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download.example.invalid
          DOWNLOAD_TEST_RELEASE_ID=$(openssl rand -hex 16)
          DSH_DESKTOP_MACOS_PACK_CONCURRENCY=4
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://update.example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.example.invalid"]}'
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY=DSH Local Build (LOCAL00001)
          DSH_DESKTOP_MACOS_TEAM_ID=LOCAL00001
          CSC_LINK=$CERT_DIR/dsh-local.p12
          CSC_KEY_PASSWORD=dshlocal
          APPLE_API_KEY=$CERT_DIR/notary-dummy.txt
          APPLE_API_KEY_ID=DUMMYKEYID
          APPLE_API_ISSUER=00000000-0000-0000-0000-000000000000
          EOF
          # Uncomment to pull the bundled dsh runtime through a mirror:
          # DSH_DESKTOP_NPM_REGISTRY=https://registry.npmmirror.com
          sed -n '1,20p' apps/desktop/.env.macos

      - name: Install workspace dependencies
        timeout-minutes: 60
        run: pnpm install --frozen-lockfile

      - name: Package mac-x64
        timeout-minutes: 200
        run: |
          # The pipeline ends with Apple notarization, which must fail here because the
          # credentials above are placeholders. The bundle is complete by then.
          set +e
          pnpm run package:desktop:mac:x64:dir > "$RUNNER_TEMP/package.log" 2>&1
          PKG_EXIT=$?
          set -e
          echo "packaging exit: $PKG_EXIT (a failure at the notarization step is expected)"
          tail -n 40 "$RUNNER_TEMP/package.log"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::no application bundle was produced; see the packaging log above"
            exit 1
          fi
          if ! grep -qF "$SMOKE_MARKER" "$RUNNER_TEMP/package.log"; then
            echo "::error::the packaged runtime smoke test did not pass"
            exit 1
          fi
          echo "application bundle produced and runtime smoke passed"

      - name: Verify the bundle
        run: |
          # These are exactly the properties that decide whether the archive works on
          # somebody else's Mac.
          if ! file "$APP_PATH/Contents/MacOS/DeepSeek Harness" | grep -q x86_64; then
            echo "::error::the main binary is not x86_64"
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"

          # Hardened runtime enables library validation, which a self-signed certificate
          # without an Apple Team ID cannot satisfy; the bundled Node and Python would
          # then fail to load their own libraries on the target machine.
          hardened_flags() {
            codesign -dv --verbose=4 "$1" 2>&1 \
              | sed -n 's/^CodeDirectory.*flags=0x[0-9a-f]*(\(.*\)).*$/\1/p' | head -1
          }
          for rel in \
            "Contents/MacOS/DeepSeek Harness" \
            "Contents/Resources/runtime/primary-runtime/dependencies/node/bin/node" \
            "Contents/Resources/runtime/primary-runtime/dependencies/python/bin/python3"; do
            file "$APP_PATH/$rel" | grep -q x86_64 || {
              echo "::error::$rel is not x86_64"; exit 1
            }
            flags=$(hardened_flags "$APP_PATH/$rel")
            case ",$flags," in
              *,runtime,*)
                echo "::error::$rel is signed with hardened runtime; the local patches did not take effect"
                exit 1
                ;;
            esac
          done

          if xattr -p com.apple.quarantine "$APP_PATH" >/dev/null 2>&1; then
            echo "::error::the built app carries a quarantine attribute"
            exit 1
          fi

          "$APP_PATH/Contents/Resources/runtime/primary-runtime/dependencies/node/bin/node" -e \
            "console.log('bundled node', process.version, process.arch)"
          "$APP_PATH/Contents/Resources/runtime/primary-runtime/dependencies/python/bin/python3" -c \
            "import sys; print('bundled python', sys.version.split()[0])"
          echo "arch, signature, no hardened runtime, no quarantine: ok"

      - name: Create the distributable archives
        id: archive
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          SHA=$(git rev-parse --short HEAD)
          NAME="deepseek-harness-${VERSION}-${SHA}-macos-x64"
          mkdir -p dist

          ditto -c -k --keepParent "$APP_PATH" "dist/${NAME}.zip"

          STAGE=$(mktemp -d)/root
          mkdir -p "$STAGE"
          ditto "$APP_PATH" "$STAGE/DeepSeek Harness.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DeepSeek Harness" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/${NAME}.dmg" >/dev/null
          rm -rf "$(dirname "$STAGE")"

          ZIPSHA=$(shasum -a 256 "dist/${NAME}.zip" | awk '{print $1}')
          DMGSHA=$(shasum -a 256 "dist/${NAME}.dmg" | awk '{print $1}')
          ( cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt )

          cat > dist/使用说明.txt <<EOF
          DeepSeek Harness 桌面端 — macOS Intel (x86_64) 内部构建
          =========================================================

          版本     ${VERSION}
          提交     ${SHA}
          架构     x86_64（Intel 原生）
          系统要求 macOS 13.0 (Ventura) 或更高

          上游：https://github.com/deepseek-ai/deepseek-harness  （MIT）
          这是内部构建，非官方发布产物，没有 Apple 签名也没有公证。

          安装
          ----
          dmg：双击挂载 → 把 "DeepSeek Harness.app" 拖到 Applications → 推出磁盘映像。
          zip：解压后把 app 拖到 Applications。
              解压请用 Finder 或 ditto -x -k，不要用 unzip（会丢掉 bundle 的符号链接和权限位）。

          打不开怎么办
          ------------
          内网共享 / U 盘 / scp 传过去的文件没有 quarantine 标记，双击即可打开。
          如果是从网盘、IM、邮件、AirDrop 拿到的，会带 quarantine 标记，需要先清掉：

              xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"

          请不要用 sudo spctl --master-disable 关掉全局 Gatekeeper。

          Apple Silicon（M 系列）
          ----------------------
          这是 Intel x86_64 构建，需要先装 Rosetta 2：softwareupdate --install-rosetta

          已知限制
          --------
          1. 检查更新会失败：更新地址是占位符，不会自动更新。升级请换用新的包。
          2. 账号登录未接通（上游 developer preview 状态），请在设置里填 DeepSeek API Key。
          3. 与 CLI 版共享 ~/.dsh 下的会话和设置。
          4. developer preview，profile 数据不保证跨版本兼容。

          完整性校验
          ----------
          SHA-256:

            ${ZIPSHA}
                ${NAME}.zip

            ${DMGSHA}
                ${NAME}.dmg

          校验命令：shasum -a 256 <文件名>

          自包含说明
          ----------
          app 内已带完整运行时，目标机器无需预装 Node.js 或 Python。
          安装后不依赖任何构建目录，可随意移动。
          EOF

          ls -lh dist/
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-macos-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            TAG="dsh-macos-x64-${VERSION}"
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" \
                 --title "DeepSeek Harness macOS Intel ${VERSION}" \
                 --notes "内部构建（自签名，未公证）。下载后如无法打开，请执行：xattr -dr com.apple.quarantine \"/Applications/DeepSeek Harness.app\""
          gh release upload "$TAG" \
            "dist/${NAME}.zip" "dist/${NAME}.dmg" "dist/使用说明.txt" "dist/SHA256SUMS.txt" \
            --clobber
