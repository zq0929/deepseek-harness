# Keep this fork's master in step with deepseek-ai/deepseek-harness and build a
# macOS Intel (x86_64) desktop app whenever upstream moves.
#
# Two jobs:
#   sync   - asks GitHub to fast-forward or merge the fork from upstream master,
#            and reports whether anything changed.
#   build  - runs only when something changed (or when forced), on the standard
#            Intel runner, using upstream's own unsigned macOS path
#            (`package:mac:x64:unsigned`: ad-hoc signing, no certificate, no
#            notarization, no .env.macos).
#
# Every successful build publishes (or updates) the GitHub Release for that version,
# so the nightly run needs no manual step: the zip, the dmg and the instructions are
# attached to the tag dsh-macos-x64-<version>.
#
# The sync job runs in the same workflow as the build on purpose: a push made with
# the workflow's own GITHUB_TOKEN does not start other workflow runs, so a separate
# "build on push" workflow would never fire.
#
# The app is ad-hoc signed, which Gatekeeper rejects for a quarantined download.
# Recipients clear the attribute once:
#   xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"

name: Build macOS Intel (x86_64)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the fork already matches upstream
        type: boolean
        default: false
  schedule:
    # 02:17 Beijing (18:17 UTC), off the hour because scheduled runs queue up then.
    - cron: '17 18 * * *'

# The sync job merges upstream into master, and a release needs write access.
permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness
  DSH_TELEMETRY_DISABLED: '1'

concurrency:
  group: build-macos-intel
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the fork with upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      head: ${{ steps.sync.outputs.head }}
    steps:
      - name: Fast-forward or merge from upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "fork master:     $(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          echo "upstream master: $(gh api "repos/$UPSTREAM_REPOSITORY/commits/master" --jq .sha)"

          # The same operation as the "Sync fork" button: fast-forward when the fork
          # is a strict ancestor of upstream, merge when the fork has its own commits.
          set +e
          RESPONSE=$(gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch=master 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$RESPONSE"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::the fork could not be synced from upstream (most likely a merge conflict); resolve it and re-run"
            exit 1
          fi

          MERGE_TYPE=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("merge_type", "none"))')
          echo "merge_type=$MERGE_TYPE"
          echo "head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" >> "$GITHUB_OUTPUT"
          case "$MERGE_TYPE" in
            fast-forward|merge)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "upstream moved; the fork now has it"
              ;;
            none)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "the fork already matches upstream; no build needed"
              ;;
            *)
              echo "::warning::unexpected merge_type $MERGE_TYPE"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build macOS Intel (x86_64)
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || inputs.force }}
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      TARGET_DIR: apps/desktop/.desktop-build/targets/mac-x64
      APP_PATH: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/mac/DeepSeek Harness.app
      # Running the bundled Python inside the signed bundle would write __pycache__
      # into it and invalidate the seal; never let it.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Report runner
        run: |
          sw_vers
          uname -m
          df -h /

      - uses: actions/checkout@v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Refresh to the branch head the sync job produced
        run: |
          # A scheduled run carries the branch tip from before the sync job merged
          # upstream, so check out the current head explicitly.
          git fetch --depth 1 origin master
          git checkout --detach FETCH_HEAD
          echo "building $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
          if [ "$(git rev-parse HEAD)" != "${{ needs.sync.outputs.head }}" ]; then
            echo "::warning::checked out a different commit than the sync job reported"
          fi
          node -p "'desktop version ' + require('./apps/desktop/package.json').version"

      - name: Free disk space
        run: |
          # A standard macOS runner advertises 14 GB of usable SSD and this build needs
          # roughly 10 GB, so reclaim the simulator runtimes and caches it never uses.
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          rm -rf ~/Library/Caches/Homebrew ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
          df -h /

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install workspace dependencies
        timeout-minutes: 60
        run: pnpm install --frozen-lockfile

      # The unsigned path takes no release settings, so it needs no dotenv file and no
      # signing material. It ad-hoc signs the bundle, skips notarization, and runs the
      # packaged-runtime smoke test against the finished application.
      - name: Package mac-x64 (unsigned)
        timeout-minutes: 180
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Verify the bundle
        run: |
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::no application bundle was produced"
            exit 1
          fi

          # These are exactly the properties that decide whether the archive works on
          # somebody else's Mac.
          if ! file "$APP_PATH/Contents/MacOS/DeepSeek Harness" | grep -q x86_64; then
            echo "::error::the main binary is not x86_64"
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)' || true

          # The decisive test: both bundled interpreters must actually start under this
          # signature, which is what fails when a bundle's code signing is wrong.
          "$APP_PATH/Contents/Resources/runtime/primary-runtime/dependencies/node/bin/node" -e \
            "console.log('bundled node', process.version, process.arch)"
          "$APP_PATH/Contents/Resources/runtime/primary-runtime/dependencies/python/bin/python3" -c \
            "import sys; print('bundled python', sys.version.split()[0])"

          if xattr -p com.apple.quarantine "$APP_PATH" >/dev/null 2>&1; then
            echo "::error::the built app carries a quarantine attribute"
            exit 1
          fi
          echo "arch, signature and bundled runtime: ok"

      - name: Clean interpreter residue and verify the shipped signature
        run: |
          # The packaged-runtime smoke runs the bundled Python inside the app bundle, and
          # Python writes __pycache__ next to the modules it imports. Those files appear
          # after signing and are not part of the seal, so an archive that contains them
          # fails codesign --verify for whoever unpacks it. Drop them, then prove the
          # bundle that actually ships still verifies.
          find "$APP_PATH" -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP_PATH" -name '*.pyc' -delete 2>/dev/null || true
          if find "$APP_PATH" -name '*.pyc' | grep -q .; then
            echo "::error::interpreter residue survived the cleanup"
            exit 1
          fi
          codesign --verify --deep --strict "$APP_PATH"
          echo "the bundle that ships verifies"

      - name: Create the distributable archives
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          SHA=$(git rev-parse --short HEAD)
          NAME="deepseek-harness-${VERSION}-${SHA}-macos-x64"
          mkdir -p dist

          # electron-builder already produced a DMG (with the Applications symlink);
          # give it this workflow's naming, then add a ditto-made zip beside it.
          DMG=$(ls "$TARGET_DIR"/unsigned-artifacts/*.dmg | head -1)
          cp "$DMG" "dist/${NAME}.dmg"
          ditto -c -k --keepParent "$APP_PATH" "dist/${NAME}.zip"

          # The DMG is the primary download, so verify the bundle a recipient mounts.
          MP=$(hdiutil attach -nobrowse -readonly "dist/${NAME}.dmg" | awk -F'\t' '/\/Volumes\//{print $NF; exit}')
          if [ -z "$MP" ]; then
            echo "::error::the dmg did not mount"
            exit 1
          fi
          codesign --verify --deep --strict "$MP/DeepSeek Harness.app"
          echo "dmg bundle verifies: CDHash $(codesign -dv --verbose=4 "$MP/DeepSeek Harness.app" 2>&1 | sed -n 's/^CDHash=//p')"
          hdiutil detach "$MP" >/dev/null

          # Verify the ZIP the way a recipient experiences it: extract it fresh and check
          # the bundle inside. A signature that only survives until the archive is written
          # is exactly the defect this catches.
          CHECK=$(mktemp -d)
          ditto -x -k "dist/${NAME}.zip" "$CHECK"
          if find "$CHECK/DeepSeek Harness.app" -name '*.pyc' | grep -q .; then
            echo "::error::the zip contains Python bytecode residue"
            exit 1
          fi
          codesign --verify --deep --strict "$CHECK/DeepSeek Harness.app"
          rm -rf "$CHECK"
          echo "zip verified after extraction"

          ZIPSHA=$(shasum -a 256 "dist/${NAME}.zip" | awk '{print $1}')
          DMGSHA=$(shasum -a 256 "dist/${NAME}.dmg" | awk '{print $1}')
          ( cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt )

          cat > dist/使用说明.txt <<EOF
          DeepSeek Harness 桌面端 — macOS Intel (x86_64) 内部构建
          =========================================================

          版本     ${VERSION}
          提交     ${SHA}
          架构     x86_64（Intel 原生）
          系统要求 macOS 13.0 (Ventura) 或更高

          上游：https://github.com/deepseek-ai/deepseek-harness  （MIT）
          这是内部构建，非官方发布产物，没有 Apple 开发者签名也没有公证。

          安装
          ----
          dmg：双击挂载 → 把 "DeepSeek Harness.app" 拖到 Applications → 推出磁盘映像。
          zip：解压后把 app 拖到 Applications。
              解压请用 Finder 或 ditto -x -k，不要用 unzip（会丢掉 bundle 的符号链接和权限位）。

          打不开怎么办
          ------------
          内网共享 / U 盘 / scp 传过去的文件没有 quarantine 标记，双击即可打开。
          如果是从网盘、IM、邮件、AirDrop 拿到的，会带 quarantine 标记，需要先清掉：

              xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"

          请不要用 sudo spctl --master-disable 关掉全局 Gatekeeper。

          Apple Silicon（M 系列）
          ----------------------
          这是 Intel x86_64 构建，需要先装 Rosetta 2：softwareupdate --install-rosetta

          已知限制
          --------
          1. 检查更新会失败：内部构建不带更新源，不会自动更新。升级请换用新的包。
          2. 账号登录未接通（上游 developer preview 状态），请在设置里填 DeepSeek API Key。
          3. 与 CLI 版共享 ~/.dsh 下的会话和设置。
          4. developer preview，profile 数据不保证跨版本兼容。

          完整性校验
          ----------
          SHA-256:

            ${ZIPSHA}
                ${NAME}.zip

            ${DMGSHA}
                ${NAME}.dmg

          校验命令：shasum -a 256 <文件名>

          自包含说明
          ----------
          app 内已带完整运行时，目标机器无需预装 Node.js 或 Python。
          安装后不依赖任何构建目录，可随意移动。
          EOF

          # GitHub replaces a non-ASCII release-asset name with "default.txt", so the
          # release uploads this ASCII copy while the artifact keeps the Chinese name.
          cp dist/使用说明.txt README-zh-CN.txt

          ls -lh dist/
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIPSHA=${ZIPSHA}" >> "$GITHUB_ENV"
          echo "DMGSHA=${DMGSHA}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: deepseek-harness-macos-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dsh-macos-x64-${VERSION}"

          # Alpha/beta/rc builds are marked as prereleases so GitHub keeps the newest
          # stable release as "latest" instead of pointing it at an internal build.
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          cat > release-notes.md <<EOF
          内部构建（ad-hoc 签名，未公证），macOS Intel (x86_64)，版本 ${VERSION}。

          **安装**：下载 dmg → 拖入 Applications。

          **首次打开**：从网盘 / IM / 邮件拿到的文件带 quarantine 标记，需要先执行：

              xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"

          | 文件 | SHA-256 |
          |---|---|
          | ${NAME}.zip | ${ZIPSHA} |
          | ${NAME}.dmg | ${DMGSHA} |

          其余说明见附件 README-zh-CN.txt（使用说明）。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "DeepSeek Harness macOS Intel ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "DeepSeek Harness macOS Intel ${VERSION}" \
              --notes-file release-notes.md $PRERELEASE
          fi
          gh release upload "$TAG" \
            "dist/${NAME}.zip" "dist/${NAME}.dmg" README-zh-CN.txt "dist/SHA256SUMS.txt" \
            --clobber
          echo "release published: $(gh release view "$TAG" --json url --jq .url)"
